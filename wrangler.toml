name = "relay-monitor"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# D1 database binding. Create it once with:
#   wrangler d1 create relay-monitor
# then paste the returned database_id below (and in the Cloudflare Pages
# dashboard: Settings -> Functions -> D1 database bindings, variable name DB).
[[d1_databases]]
binding = "DB"
database_name = "relay-monitor"
database_id = "f9c918cd-bdc1-4f9f-a3a7-20f6261131a0"

# Non-secret vars can live here. Secrets (APP_PASSWORD, SESSION_SECRET) must be
# set with `wrangler pages secret put <NAME>` or in the dashboard, NOT here.
[vars]
# APP_PASSWORD  -> set as a secret
# SESSION_SECRET -> set as a secret
